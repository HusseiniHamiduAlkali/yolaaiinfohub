[build]
  command = "npm install && npm run build"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "components/AI/**,scripts/apiConfig.js,server.js"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[redirects]]
  from = "/api/gemini"
  to = "/.netlify/functions/gemini"
  status = 200
  force = true

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200
  force = true

[[redirects]]
from = "/admin/servi"
to = "/components/admin/admin-servi.html"
status = 200
force = true

[[redirects]]
from = "/admin/setup"
to = "/pages/admin-setup.html"
status = 200
force = true

[[redirects]]
from = "/servi/*"
to = "/components/serviinfo/servi-profile.html"
status = 200
force = true

[[redirects]]
  from = "/*"
  to = "/pages/404.html"
  status = 404
