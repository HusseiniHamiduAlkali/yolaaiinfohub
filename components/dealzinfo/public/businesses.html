<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yola business directory — shops, suppliers and services — DealzInfo</title>
    <meta
      name="description"
      content="Browse verified shops, wholesalers, farmers, artisans and service providers across Yola, Jimeta, Girei, Ngurore and Numan."
    />
    <base href="/dealzinfo/" />
    <link rel="canonical" href="/dealzinfo/businesses.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../fontawesome/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/dealz.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
      <div class="wrap stack-lg">
        <section class="stack">
          <h1>Business directory</h1>
          <p class="muted">
            Local shops, suppliers and services. Verified listings have been confirmed by the DealzInfo team.
          </p>
        </section>

        <section class="card stack" aria-label="Filters">
          <div class="filters">
            <div class="field field-wide">
              <label for="q">Search</label>
              <input id="q" type="search" placeholder="Grains, pharmacy, tailor…" />
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category"></select>
            </div>
            <div class="field">
              <label for="area">Area</label>
              <select id="area"></select>
            </div>
          </div>
          <div class="row row-between">
            <p class="small muted" id="result-count" aria-live="polite"></p>
            <a class="button button-gold button-sm" href="submit.html?tab=business">List your business</a>
          </div>
        </section>

        <section class="grid grid-3" id="results" aria-live="polite"></section>
      </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="js/shell.js"></script>
    <script type="module" src="js/pages/businesses.js"></script>
  </body>
</html>
