<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Price trends and volatility for Yola commodities — DealzInfo</title>
    <meta
      name="description"
      content="See how commodity prices in Yola have moved over the last week, month or six months, with high, low, average and volatility figures."
    />
    <base href="/dealzinfo/" />
    <link rel="canonical" href="/dealzinfo/trends.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../fontawesome/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/dealz.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
      <div class="wrap stack-lg">
        <section class="stack">
          <h1>Price trends</h1>
          <p class="muted">Average recorded price per day, so you can see the direction before the market does.</p>
        </section>

        <section class="card stack" aria-label="Trend filters">
          <div class="filters">
            <div class="field">
              <label for="commodity">Commodity</label>
              <select id="commodity"></select>
            </div>
            <div class="field">
              <label for="market">Market</label>
              <select id="market"></select>
            </div>
            <div class="field">
              <label for="range">Period</label>
              <select id="range">
                <option value="7">Last 7 days</option>
                <option value="30" selected>Last 30 days</option>
                <option value="90">Last 3 months</option>
                <option value="180">Last 6 months</option>
              </select>
            </div>
            <div class="field" style="align-self: end">
              <button class="button button-outline" id="export" type="button">Export CSV</button>
            </div>
          </div>
        </section>

        <section class="grid grid-4" id="summary" aria-live="polite"></section>

        <section class="card stack">
          <h2 id="chart-title">Price movement</h2>
          <div class="chart-box"><canvas id="chart" aria-labelledby="chart-title" role="img"></canvas></div>
          <p class="tiny muted" id="chart-note"></p>
        </section>

        <section class="stack">
          <h2>Recorded points</h2>
          <div class="table-scroll">
            <table>
              <caption class="sr-only">Daily average price for the selected commodity</caption>
              <thead>
                <tr>
                  <th scope="col">Date</th>
                  <th scope="col" class="num">Average price</th>
                  <th scope="col" class="num">Change on previous</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="js/shell.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script type="module" src="js/pages/trends.js"></script>
  </body>
</html>
