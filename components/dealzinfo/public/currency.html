<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live currency converter — DealzInfo</title>
    <meta name="description" content="Convert Naira, CFA Franc, Dollar, Pound, Riyal and more at once, with flags." />
    <base href="/dealzinfo/" />
    <link rel="canonical" href="/dealzinfo/currency.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../fontawesome/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/dealz.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div id="site-header"></div>

    <main id="main">
      <div class="wrap stack-lg">
<section class="stack"><h1>Currency converter</h1><p class="muted">Type an amount in any box — every other currency updates instantly.</p><p class="small muted"><span id="updated">Loading rates…</span> <button class="button button-outline button-sm" id="refresh" type="button">Refresh</button></p></section>
<div class="fx-grid" id="fx"></div>
<p class="small muted">Rates are mid-market guides. Street (BDC) rates can differ.</p>
<section class="card stack"><div class="filters"><div class="field"><label for="commodity">Commodity</label><select id="commodity"></select></div><div class="field"><label for="market">Market</label><select id="market"></select></div><div class="field"><label for="status">Status</label><select id="status"><option value="all">All statuses</option><option>VERIFIED</option><option>PENDING</option><option>OUTDATED</option><option>COMMUNITY SUBMITTED</option></select></div><div class="field" style="align-self:end"><button class="button button-outline" id="export" type="button">Export CSV</button></div></div><p class="small muted" id="count" aria-live="polite"></p></section>
<div class="table-scroll"><table><caption class="sr-only">Price records</caption><thead><tr><th scope="col">Date</th><th scope="col">Commodity</th><th scope="col">Market</th><th scope="col" class="num">Price</th><th scope="col">Source</th><th scope="col">Status</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="center"><button class="button button-outline" id="more" type="button" hidden>Load more</button></div>
      </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="js/shell.js"></script>
    <script type="module" src="js/pages/currency.js"></script>
  </body>
</html>
