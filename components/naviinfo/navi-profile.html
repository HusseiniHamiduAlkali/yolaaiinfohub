<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NaviInfo place</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/styles/global.css" />
  <link rel="stylesheet" href="/pages/styles/pages.css" />
  <link rel="stylesheet" href="/styles/servi.css" />
  <style>
    body { margin: 0; background: #f7f3ea; color: #123; font-family: 'Plus Jakarta Sans', sans-serif; }
    .page-content { max-width: 1100px; margin: 0 auto; padding: 32px 20px 60px; }
    .crumbs { display: flex; gap: 8px; flex-wrap: wrap; color: #4d6a5f; margin-bottom: 24px; }
    .profile-layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); gap: 24px; }
    .profile-card, .contact-panel { background: #fff; border-radius: 20px; box-shadow: 0 18px 32px rgba(11, 35, 28, 0.08); border: 1px solid rgba(7, 75, 55, 0.08); }
    .profile-card { padding: 24px; }
    .contact-panel { padding: 24px; }
    .profile-hero { display: flex; gap: 18px; align-items: center; }
    .avatar { width: 88px; height: 88px; border-radius: 18px; background: linear-gradient(135deg, #064e3b, #17997a); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 1.5rem; }
    .pro-id h1 { margin: 0; font-size: clamp(2rem, 2vw + 1rem, 2.7rem); }
    .pro-role { margin: 6px 0 0; color: #4a5f59; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .tag { background: #edf7f2; border: 1px solid #d9eede; border-radius: 999px; padding: 6px 10px; color: #064e3b; font-size: 12px; }
    .pro-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 18px; color: #3a4a47; }
    .pro-meta span { display: inline-flex; gap: 8px; align-items: center; }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    .badge-open { background: #e8f7ef; color: #0f7a46; }
    .service-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 12px; }
    .service-list li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #ecf0eb; padding-bottom: 8px; }
    .service-price { color: #0d6b53; font-weight: 700; }
    .hours-grid { display: grid; gap: 8px; }
    .hours-grid > div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid #edf0eb; padding-bottom: 8px; }
    .contact-actions { display: grid; gap: 10px; margin-top: 16px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 0.8rem 1.1rem; text-decoration: none; border: 1px solid transparent; font-weight: 600; }
    .btn-primary { background: linear-gradient(135deg, #064e3b, #17997a); color: white; }
    .btn-secondary { background: #fff; border-color: rgba(6, 78, 59, 0.2); color: #0f2f2a; }
    @media (max-width: 850px) { .profile-layout { grid-template-columns: 1fr; } .profile-hero { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
  <main class="page-content has-contact-bar">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="/">Home</a> <span aria-hidden="true">/</span>
      <a href="/index.html#naviinfo">NaviInfo</a> <span aria-hidden="true">/</span>
      <span id="crumbName">Place</span>
    </nav>

    <div class="profile-layout">
      <div>
        <div class="profile-card">
          <div class="profile-hero">
            <div class="avatar" id="placeAvatar">N</div>
            <div class="pro-id">
              <h1 id="placeName">Loading…</h1>
              <p class="pro-role" id="placeCategory">Navigation place</p>
              <div class="pro-meta" style="margin-top: 14px;">
                <span><i class="fas fa-location-dot" aria-hidden="true"></i> <span id="placeArea">Yola</span></span>
                <span><i class="fas fa-clock" aria-hidden="true"></i> <span id="placeHours">Hours vary</span></span>
              </div>
            </div>
          </div>
          <div class="tag-row" id="placeTags"></div>
        </div>

        <div class="profile-card">
          <h2>About</h2>
          <p id="placeDescription">Loading place details…</p>
        </div>

        <div class="profile-card">
          <h2>Location and services</h2>
          <ul class="service-list" id="placeServices"></ul>
        </div>

        <div class="profile-card">
          <h2>Address</h2>
          <p id="placeAddress">Loading address…</p>
        </div>
      </div>

      <aside class="contact-panel" aria-label="Contact this place">
        <h2 id="contactTitle">Contact</h2>
        <p id="contactSummary">Quick access details for this place.</p>
        <div class="contact-actions">
          <a class="btn btn-primary" id="placeCall" href="#"><i class="fas fa-phone" aria-hidden="true"></i> Call now</a>
          <a class="btn btn-secondary" id="placeWebsite" href="#" target="_blank" rel="noopener"><i class="fas fa-globe" aria-hidden="true"></i> Website</a>
          <a class="btn btn-secondary" id="placeMap" href="#" target="_blank" rel="noopener"><i class="fas fa-route" aria-hidden="true"></i> Open map</a>
        </div>
      </aside>
    </div>
  </main>

  <script>
    function queryParam(name) {
      const match = new URLSearchParams(window.location.search).get(name);
      return match ? decodeURIComponent(match) : '';
    }

    function initials(value) {
      return String(value || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0].toUpperCase()).join('');
    }

    function renderTagList(list) {
      const el = document.getElementById('placeTags');
      if (!el) return;
      el.innerHTML = '';
      (list || []).forEach((tag) => {
        const chip = document.createElement('span');
        chip.className = 'tag';
        chip.textContent = tag;
        el.appendChild(chip);
      });
    }

    function renderServices(list) {
      const el = document.getElementById('placeServices');
      if (!el) return;
      el.innerHTML = '';
      if (!list || !list.length) {
        el.innerHTML = '<li><span>No service list provided yet.</span></li>';
        return;
      }
      list.forEach((service) => {
        const item = document.createElement('li');
        item.innerHTML = '<span>' + service + '</span><span class="service-price">Info</span>';
        el.appendChild(item);
      });
    }

    async function loadPlace() {
      const slug = queryParam('slug') || window.location.pathname.split('/').filter(Boolean).pop();
      if (!slug) return;
      const response = await fetch('/api/content/navigation-places/' + encodeURIComponent(slug), { credentials: 'include' });
      if (!response.ok) {
        document.getElementById('placeName').textContent = 'Place not found';
        return;
      }
      const data = await response.json();
      const item = data.item || {};
      const name = item.displayName || 'Navigation place';
      document.title = name + ' | NaviInfo';
      document.getElementById('crumbName').textContent = name;
      document.getElementById('placeName').textContent = name;
      document.getElementById('placeCategory').textContent = item.category || 'Navigation place';
      document.getElementById('placeArea').textContent = item.area || 'Yola';
      document.getElementById('placeHours').textContent = item.openingHours || 'Hours vary';
      document.getElementById('placeDescription').textContent = item.description || 'No description provided yet.';
      document.getElementById('placeAddress').textContent = item.address || 'Address not yet available.';
      document.getElementById('placeAvatar').textContent = initials(name);
      document.getElementById('contactTitle').textContent = 'Contact ' + name;
      document.getElementById('contactSummary').textContent = (item.address || 'Local place details') + ' · ' + (item.area || 'Yola');
      renderTagList(item.tags || []);
      renderServices(item.services && item.services.length ? item.services : [item.category || 'Navigation service']);

      const callLink = document.getElementById('placeCall');
      const websiteLink = document.getElementById('placeWebsite');
      const mapLink = document.getElementById('placeMap');
      const phone = item.contact && item.contact.phone ? item.contact.phone : '';
      const website = item.contact && item.contact.website ? item.contact.website : '';
      const lat = item.coordinates && item.coordinates.lat != null ? item.coordinates.lat : '';
      const lng = item.coordinates && item.coordinates.lng != null ? item.coordinates.lng : '';

      if (phone) {
        callLink.href = 'tel:' + encodeURIComponent(phone);
        callLink.style.display = 'inline-flex';
      } else {
        callLink.style.display = 'none';
      }
      if (website) {
        websiteLink.href = website;
        websiteLink.style.display = 'inline-flex';
      } else {
        websiteLink.style.display = 'none';
      }
      if (lat && lng) {
        mapLink.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(name + ' ' + (item.address || 'Yola'));
        mapLink.style.display = 'inline-flex';
      } else {
        mapLink.style.display = 'none';
      }
    }

    loadPlace().catch((error) => {
      console.error('Unable to load NaviInfo place:', error);
      document.getElementById('placeName').textContent = 'Place unavailable';
    });
  </script>
</body>
</html>
