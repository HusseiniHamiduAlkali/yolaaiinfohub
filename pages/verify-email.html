<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify email — Yola AI Info Hub</title>
  <link rel="stylesheet" href="styles/pages.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    body { background: linear-gradient(135deg, #f4f7f2, #e7f0ec); color: #18392c; }
    .verify-card { max-width: 560px; margin: 4rem auto; background: #fff; border-radius: 24px; padding: 2rem; box-shadow: 0 14px 48px rgba(12, 41, 31, 0.12); }
    .verify-card h1 { margin-bottom: 0.5rem; }
    .verify-card p { color: #4c6258; line-height: 1.6; }
    .field { margin-top: 1rem; }
    .field input { width: 100%; padding: 0.9rem 1rem; border: 1px solid #cfdad4; border-radius: 12px; }
    .actions { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; border-radius: 999px; padding: 0.8rem 1rem; border: none; cursor: pointer; }
    .btn-primary { background: #0f766e; color: #fff; }
    .btn-secondary { background: #eef5f2; color: #134e4a; }
    .status { margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 12px; background: #f3f5f4; } 
    .status.success { background: #e7f8ef; color: #166534; }
    .status.error { background: #fef2f2; color: #b91c1c; }
  </style>
</head>
<body>
  <main class="verify-card">
    <h1>Verify your email</h1>
    <p>Use the secure link from your inbox or enter the 6-digit code below to confirm your account.</p>
    
    <div id="verifyMethodTabs" style="display: flex; gap: 0.5rem; margin: 1.5rem 0; border-bottom: 2px solid #cfdad4;">
      <button type="button" class="verify-tab-btn is-active" data-method="token" style="flex: 1; padding: 0.75rem; border: none; background: none; cursor: pointer; font-weight: 500; color: #0f766e; border-bottom: 3px solid #0f766e; position: relative; bottom: -2px;">
        <i class="fas fa-link"></i> Link Verification
      </button>
      <button type="button" class="verify-tab-btn" data-method="otp" style="flex: 1; padding: 0.75rem; border: none; background: none; cursor: pointer; font-weight: 500; color: #999; border-bottom: 3px solid transparent; position: relative; bottom: -2px;">
        <i class="fas fa-shield-halved"></i> Code Verification
      </button>
    </div>
    
    <form id="verifyForm" novalidate>
      <!-- Link/Token Method -->
      <div class="verify-method" data-method="token" id="tokenMethod">
        <div class="field">
          <label for="verifyEmail">Email</label>
          <input id="verifyEmail" name="email" type="email" placeholder="you@example.com" />
        </div>
        <p style="font-size: 0.9rem; color: #666; margin-top: 0.5rem;">If you have the verification link from your email, you can verify directly without entering a code.</p>
      </div>
      
      <!-- OTP Method -->
      <div class="verify-method" data-method="otp" id="otpMethod" style="display: none;">
        <div class="field">
          <label for="verifyEmail2">Email</label>
          <input id="verifyEmail2" name="email" type="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="verifyCode">Verification code</label>
          <input id="verifyCode" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" required />
        </div>
      </div>
      
      <div class="actions">
        <button class="btn btn-primary" type="submit"><i class="fas fa-shield-halved"></i> Verify</button>
        <a class="btn btn-secondary" href="auth.html"><i class="fas fa-arrow-left"></i> Back to sign in</a>
      </div>
    </form>
    <div id="verifyStatus" class="status" role="status" aria-live="polite"></div>
  </main>
  <script>
    (function () {
      const getApiBase = function () {
        const configuredBase = (window.API_BASE || window.__API_BASE__ || '').replace(/\/$/, '');
        if (configuredBase) return configuredBase;

        const host = window.location && window.location.hostname ? window.location.hostname : '';
        if (!host || host === 'localhost' || host === '127.0.0.1' || host === '::1' || host.startsWith('192.') || host.startsWith('10.')) {
          return 'http://localhost:4000';
        }

        return 'https://yolaaiinfohub-backend.onrender.com';
      };

      const params = new URLSearchParams(window.location.search);
      const verifyForm = document.getElementById('verifyForm');
      const statusEl = document.getElementById('verifyStatus');
      const tabButtons = document.querySelectorAll('.verify-tab-btn');
      const methodDivs = document.querySelectorAll('.verify-method');
      const tokenToken = params.get('token');
      const paramEmail = params.get('email');
      const tokenEmailInput = document.getElementById('verifyEmail');
      const otpEmailInput = document.getElementById('verifyEmail2');
      const otpCodeInput = document.getElementById('verifyCode');
      let currentMethod = 'token';

      function syncMethodState(method) {
        const isTokenMethod = method === 'token';
        tokenEmailInput.disabled = !isTokenMethod;
        otpEmailInput.disabled = isTokenMethod;
        otpCodeInput.disabled = isTokenMethod;
        tokenEmailInput.required = isTokenMethod;
        otpEmailInput.required = !isTokenMethod;
        otpCodeInput.required = !isTokenMethod;
      }

      function setTabState(method) {
        currentMethod = method;
        tabButtons.forEach((btn) => {
          const isActive = btn.getAttribute('data-method') === method;
          btn.classList.toggle('is-active', isActive);
          btn.style.color = isActive ? '#0f766e' : '#999';
          btn.style.borderBottomColor = isActive ? '#0f766e' : 'transparent';
        });
        methodDivs.forEach((div) => {
          const isActive = div.getAttribute('data-method') === method;
          div.style.display = isActive ? 'block' : 'none';
        });
        syncMethodState(method);
        statusEl.innerHTML = '';
        statusEl.className = 'status';
      }

      if (tokenToken) {
        tokenEmailInput.value = paramEmail || '';
        statusEl.className = 'status';
        statusEl.innerHTML = '<i class="fas fa-info-circle"></i> Verification link detected. Verifying your email...';
      }

      setTabState('token');

      tabButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
          setTabState(btn.getAttribute('data-method'));
        });
      });

      verifyForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const apiBase = getApiBase();

        try {
          if (currentMethod === 'token') {
            const email = tokenEmailInput.value.trim();
            if (!email && !tokenToken) {
              statusEl.className = 'status error';
              statusEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> Enter your email address.';
              return;
            }

            const response = await fetch(apiBase + '/api/verify-email', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({
                email: email || paramEmail,
                token: tokenToken
              })
            });

            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.success) {
              statusEl.className = 'status error';
              statusEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> ' + (data.error || 'Verification failed.');
              return;
            }

            statusEl.className = 'status success';
            statusEl.innerHTML = '<i class="fas fa-circle-check"></i> Your email is verified. You can now sign in.';
            return;
          }

          const email = otpEmailInput.value.trim();
          const code = otpCodeInput.value.trim();
          if (!email || !code) {
            statusEl.className = 'status error';
            statusEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> Enter both your email and the verification code.';
            return;
          }

          const response = await fetch(apiBase + '/api/verify-email-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ email, code })
          });

          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.success) {
            statusEl.className = 'status error';
            statusEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> ' + (data.error || 'Verification failed.');
            return;
          }

          statusEl.className = 'status success';
          statusEl.innerHTML = '<i class="fas fa-circle-check"></i> Your email is verified. You can now sign in.';
        } catch (error) {
          statusEl.className = 'status error';
          statusEl.innerHTML = '<i class="fas fa-circle-exclamation"></i> ' + (error && error.message ? error.message : 'Verification failed.');
        }
      });

      if (tokenToken) {
        setTimeout(() => {
          if (currentMethod === 'token') {
            verifyForm.requestSubmit();
          }
        }, 150);
      }
    })();
  </script>
</body>
</html>
