services:
  - type: web
    name: yolainfohub-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: HOST
        value: 0.0.0.0
      - key: MONGO_URI
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: "Yola AI Info Hub - Authentication"
      - key: FRONTEND_URL
        value: https://yolaaiinfohub.netlify.app
      - key: FRONT_END_URL
        value: https://yolaaiinfohub.netlify.app
      - key: BACKEND_URL
        value: https://yolaaiinfohub-authentication.onrender.com
      - key: BACK_END_URL
        value: https://yolaaiinfohub-authentication.onrender.com
      - key: RESET_URL_BASE
        value: https://yolaaiinfohub.netlify.app/pages/reset-password.html
      - key: CORS_ORIGINS
        value: https://yolaaiinfohub.netlify.app,https://yolaaiinfohub-authentication.onrender.com,http://localhost:5500,http://localhost:4000
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEBUG_RESET
        value: false
      - key: SUPPRESS_RESET_LOG
        value: true
