
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Map SVG Icons</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      padding: 30px;
    }

    .icons {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
    }

    .icon {
      background: white;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    svg {
      width: 100px;
      height: 100px;
      color: #2563eb;
    }

    h3 {
      margin-top: 15px;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <h1>Map SVG Icons</h1>

  <div class="icons">

    <!-- Simple Map Pin -->
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"
              stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="9" r="2.5"
                stroke="currentColor" stroke-width="2"/>
      </svg>
      <h3>Map Pin</h3>
    </div>

    <!-- Folded Map -->
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 5.5 8.5 3l7 3 5.5-2.5v15L15.5 21l-7-3L3 20.5v-15Z"
              stroke="currentColor" stroke-width="1.8"
              stroke-linejoin="round"/>
        <path d="M8.5 3v15M15.5 6v15"
              stroke="currentColor" stroke-width="1.8"/>
      </svg>
      <h3>Folded Map</h3>
    </div>

    <!-- Map + Pin -->
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M3 5.5 8.5 3l7 3 5.5-2.5v15L15.5 21l-7-3L3 20.5v-15Z"
              stroke="currentColor" stroke-width="1.7"/>
        <path d="M8.5 3v15M15.5 6v15"
              stroke="currentColor" stroke-width="1.7"/>
              <g transform="translate(-3 0)">
        <path d="M18 9.5c0 2.4-3 5.5-3 5.5s-3-3.1-3-5.5a3 3 0 1 1 6 0Z"
              fill="currentColor" />
        <circle cx="15" cy="9.5" r="1" fill="white" />
                </g>
      </svg>
      <h3>Map + Location</h3>
    </div>

    <!-- Navigation Arrow -->
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M20 4 11 13"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
        <path d="m20 4-3 10-3-4-4-3 10-3Z"
              stroke="currentColor"
              stroke-width="2"/>
      </svg>
      <h3>Navigation Arrow</h3>
    </div>

    <!-- Comprehensive Map -->
    <div class="icon">
      <svg viewBox="0 0 64 64" fill="none">

        <path d="M7 12 22 7l20 5 15-5v40l-15 5-20-5-15 5V12Z"
              fill="currentColor"
              opacity=".08"
              stroke="currentColor"
              stroke-width="2.5"/>

        <path d="M22 7v40M42 12v40"
              stroke="currentColor"
              stroke-width="2.5"/>

        <path d="M14 39
                 C19 32 22 37 27 31
                 C32 25 34 18 40 22
                 C44 25 45 32 50 28"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"/>

        <circle cx="14" cy="39" r="4"
                fill="currentColor"/>

        <path d="M50 21
                 C45.6 21 42 24.6 42 29
                 C42 35 50 43 50 43
                 C50 43 58 35 58 29
                 C58 24.6 54.4 21 50 21Z"
              fill="currentColor"/>

        <circle cx="50" cy="29" r="2.5"
                fill="white"/>

        <path d="M38 18 47 20 41 27"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"/>
      </svg>

      <h3>Map + Route + Arrow + Pin</h3>
    </div>

    <!-- Modern Route -->
    <div class="icon">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M8 10h12l8 6h12v22H28l-8-6H8V10Z"
              fill="currentColor"
              opacity=".08"
              stroke="currentColor"
              stroke-width="2"/>
        <path d="M20 10v22M28 16v22"
              stroke="currentColor"
              stroke-width="2"/>
        <path d="M12 30c5-9 8-3 12-9s7-6 12-3"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"/>
        <path d="m32 16 5 2-4 4"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
      </svg>
      <h3>Modern Route Map</h3>
    </div>

  </div>

                <svg viewBox="0 0 24 24" width="19" height="22" fill="currentColor"><path d="M3.4 20.4l17.45-8.47a1 1 0 0 0 0-1.8L3.4 3.66a1 1 0 0 0-1.4 1.14L4.5 11 2 17.26a1 1 0 0 0 1.4 1.14z"/></svg>
                Maps & directions
            </button>-->

</body>
</html>
